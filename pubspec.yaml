name: devshakib_flutter_packages
description: >-
  Monorepo for the devShakib family of open-source Flutter packages published
  to pub.dev. Each member of packages/ ships independently.
publish_to: none

environment:
  sdk: ^3.13.0

# Dart pub workspace — one lockfile, one .dart_tool, path-resolved members.
workspace:
  - packages/loading_kit
  - packages/loading_kit/example
  - packages/apple_foundation_models
  - packages/apple_foundation_models/example
  - packages/fit_text
  - packages/fit_text/example
  - packages/vitals
  - packages/vitals/example
  - packages/anchored_list
  - packages/anchored_list/example
  - packages/masonry_kit
  - packages/masonry_kit/example
  - packages/apple_intelligence
  - packages/apple_intelligence/example
  - packages/roomplan
  - packages/roomplan/example
  - packages/file_system_access
  - packages/file_system_access/example
  - packages/ar_quick_look
  - packages/ar_quick_look/example
  - packages/cross_tab
  - packages/cross_tab/example
  - packages/woo_client

dev_dependencies:
  flutter_lints: ^6.0.0

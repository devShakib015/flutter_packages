include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore
  exclude:
    - build/**
    - '**/example/**/build/**'

linter:
  rules:
    - prefer_single_quotes
    - directives_ordering
    - unawaited_futures
    - avoid_print
    - public_member_api_docs

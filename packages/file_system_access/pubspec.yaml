name: file_system_access
description: >-
  Real files on Flutter Web. Save in place instead of downloading a copy, and
  reopen the same file after a reload with the File System Access API.

version: 0.1.0
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/file_system_access
resolution: workspace

topics:
  - web
  - files
  - filesystem
  - storage
  - browser

environment:
  sdk: ^3.13.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

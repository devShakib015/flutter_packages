name: woo_client
description: >-
  A WooCommerce client for Dart: the public Store API for carts and checkout
  with no API keys, and the full admin REST API. Typed, batched, and tested.

version: 0.3.1
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/woo_client
resolution: workspace

screenshots:
  - description: >-
      A storefront on the Store API, with no API keys. Prices arrive as integer
      minor units and print themselves in the store's own format.
    path: doc/storefront.png

topics:
  - woocommerce
  - wordpress
  - ecommerce
  - cart
  - rest

environment:
  sdk: ^3.13.0

dependencies:
  http: ^1.2.0
  http_parser: ^4.0.0
  crypto: ^3.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

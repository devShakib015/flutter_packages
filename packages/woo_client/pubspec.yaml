name: woo_client
description: >-
  A WooCommerce client for Dart: the public Store API for carts and checkout
  with no API keys, and the full admin REST API. Typed, batched, and tested.

version: 0.2.0
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/woo_client
resolution: workspace

topics:
  - woocommerce
  - cart
  - wordpress
  - ecommerce
  - rest
  - api

environment:
  sdk: ^3.13.0

dependencies:
  http: ^1.2.0
  http_parser: ^4.0.0
  crypto: ^3.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

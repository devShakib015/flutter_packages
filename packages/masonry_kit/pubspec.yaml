name: masonry_kit
description: >-
  A masonry grid whose layout is computed once and never revised, so several
  grids can share one CustomScrollView without the view jumping backwards.

version: 0.3.0
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/masonry_kit
resolution: workspace

screenshots:
  - description: >-
      A masonry grid scrolling, then reflowing from two columns to four and back
    path: doc/layout.gif
  - description: >-
      The same drag applied to both packages side by side
    path: doc/jump.gif

topics:
  - masonry
  - grid
  - sliver
  - scrolling
  - ui

environment:
  sdk: ^3.13.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only for tool/record_frames.dart, which records the two packages side by
  # side, and for the head-to-head regression test. Never imported by lib/.
  flutter_staggered_grid_view: ^0.7.0

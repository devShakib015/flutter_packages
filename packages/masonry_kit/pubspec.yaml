name: masonry_kit
description: >-
  A staggered / masonry grid for Flutter — Pinterest-style columns, as a sliver
  or a box widget. Several grids share one CustomScrollView without scrolling
  backwards.

version: 0.3.3
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/masonry_kit
resolution: workspace

screenshots:
  - description: >-
      A masonry grid scrolling, then reflowing from two columns to four and back
    path: doc/layout.gif
  - description: >-
      The same drag applied to both packages side by side
    path: doc/jump.gif

topics:
  - masonry
  - staggered-grid
  - grid
  - sliver
  - pinterest

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only for tool/record_frames.dart, which records the two packages side by
  # side, and for the head-to-head regression test. Never imported by lib/.
  flutter_staggered_grid_view: ^0.7.0

name: vitals
description: >-
  Type-safe Apple Health and Health Connect. Bucketed statistics computed natively, and writing verified end to end on iOS.

version: 0.3.1
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/vitals
resolution: workspace

screenshots:
  - description: >-
      The example writing a water sample and reading it back at the same value.
    path: doc/write_verified.png

topics:
  - health
  - healthkit
  - health-connect
  - fitness
  - ios

environment:
  sdk: ^3.13.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: VitalsPlugin
      android:
        package: com.devshakib.vitals
        pluginClass: VitalsPlugin

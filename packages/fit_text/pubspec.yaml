name: fit_text
description: >-
  Text that shrinks to fit its box, correctly. Works inside Expanded, Row,
  IntrinsicHeight and unbounded constraints, where LayoutBuilder-based
  auto-sizing gives up.
version: 0.2.1
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/fit_text
resolution: workspace

screenshots:
  - description: >-
      The same sentence in a narrowing box: FitText keeps all of it, Text
      ellipsises.
    path: doc/fitting.gif

topics:
  - text
  - layout
  - typography
  - responsive
  - ui

# The two constraints have to agree. Dart ^3.13 means Flutter 3.47, so the
# old pair promised '>=3.32.0' while actually refusing anything below 3.47.
# What this package really needs is TextScaler, which has been in Flutter since 3.12.
# Verified by analysing lib/ against a real 3.24.0 SDK.
environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

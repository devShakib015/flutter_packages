name: roomplan
description: >-
  Scan a room with Apple's RoomPlan and get it back as walls, doors, windows and
  furniture with real dimensions, plus a USDZ model. iOS, LiDAR required.

version: 0.1.0
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/roomplan
resolution: workspace

topics:
  - roomplan
  - ar
  - lidar
  - scanning
  - ios

environment:
  sdk: ^3.13.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: RoomplanPlugin

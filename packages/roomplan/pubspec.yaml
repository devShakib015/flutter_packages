name: roomplan
description: >-
  Scan a room with Apple's RoomPlan and get walls, doors, windows and furniture with real dimensions, a USDZ model, and a floor-plan widget.

version: 0.3.0
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/roomplan
resolution: workspace

screenshots:
  - description: >-
      A scanned room drawn as a floor plan, with walls, door, windows and
      recognised furniture.
    path: doc/floor_plan.png

topics:
  - roomplan
  - ar
  - lidar
  - scanning
  - ios

environment:
  sdk: ^3.13.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: RoomplanPlugin

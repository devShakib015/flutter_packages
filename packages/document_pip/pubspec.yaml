name: document_pip
description: >-
  Put live Flutter widgets in a real always-on-top OS window from Flutter Web,
  using the Document Picture-in-Picture API and Flutter's multi-view engine.

version: 0.1.0
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/document_pip
resolution: workspace

screenshots:
  - description: >-
      The page and a real always-on-top pop-out window, showing one paused
      player: same widget tree, same state, two windows.
    path: doc/popout.png

topics:
  - picture-in-picture
  - web
  - window
  - multi-view
  - floating

# Flutter 3.32, not 3.24, for exactly one reason: PlatformDispatcher
# .requestViewFocusChange exists from 3.24 but its body is a no-op stub until
# 3.32 (verified in dart:ui at each stable tag). It compiles either way, so a
# lower floor would build fine and then silently route the pop-out's keys to
# the page's focus tree. Everything else here works on 3.24 — if the focus call
# ever goes, the floor can go back down with it.
environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

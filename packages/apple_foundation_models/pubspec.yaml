name: apple_foundation_models
description: >-
  Apple's Foundation Models framework for Flutter: run the on-device language
  model with streaming, tool calling and schema-constrained structured output.
  Private, offline, free.

version: 0.5.2
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/apple_foundation_models
resolution: workspace

screenshots:
  - description: >-
      The model calls a Dart function and uses the result
    path: doc/tool.gif
  - description: >-
      Fields filling in one at a time under a schema
    path: doc/structured.gif
  - description: >-
      Streaming a response on device
    path: doc/stream.gif

topics:
  - apple-intelligence
  - llm
  - on-device
  - ai
  - ios

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AppleFoundationModelsPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: AppleFoundationModelsPlugin
        sharedDarwinSource: true

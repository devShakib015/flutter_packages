name: apple_intelligence
description: >-
  Apple Intelligence from Flutter beyond the language model: streaming
  on-device image generation, the Image Playground sheet, and Writing Tools.

version: 0.1.0
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/apple_intelligence
resolution: workspace

topics:
  - apple-intelligence
  - image-generation
  - on-device-ai
  - ios
  - macos

environment:
  sdk: ^3.13.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AppleIntelligencePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: AppleIntelligencePlugin
        sharedDarwinSource: true

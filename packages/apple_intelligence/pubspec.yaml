name: apple_intelligence
description: >-
  Apple Intelligence for Flutter: on-device image generation streamed as it is made, plus a native text field with Writing Tools and Genmoji.

version: 0.3.1
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/apple_intelligence
resolution: workspace

screenshots:
  - description: >-
      Four images generated on device, each appearing the moment it lands.
    path: doc/streaming.gif

topics:
  - apple-intelligence
  - image-generation
  - on-device-ai
  - ios
  - macos

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: AppleIntelligencePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: AppleIntelligencePlugin
        sharedDarwinSource: true

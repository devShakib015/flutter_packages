name: cross_tab
description: >-
  Coordinate the browser tabs of a Flutter Web app: send typed messages between
  them, know how many are open, and elect exactly one to do the work.

version: 0.2.0
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/cross_tab
resolution: workspace

screenshots:
  - description: >-
      Four browser tabs of one app. One is elected leader and does the polling;
      the others sit idle, and a broadcast from any tab reaches all the others.
    path: doc/leader.png
  - description: >-
      The leader's tab closed. Another was elected automatically, keeping the
      messages it had already received — nothing had to be told to take over.
    path: doc/election.png

topics:
  - web
  - broadcastchannel
  - tabs
  - leader-election
  - browser

environment:
  sdk: ^3.13.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

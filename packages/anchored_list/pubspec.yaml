name: anchored_list
description: >-
  Jump to any index in a lazy list in constant time, and hold your place when items arrive above it. One viewport anchored at the target, not two lists cross-fading.

version: 0.1.1
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/anchored_list
resolution: workspace

screenshots:
  - description: >-
      Jumping across a million rows while the live builder-call count stays flat.
    path: doc/jump.gif
  - description: >-
      The same insertion in a ListView and an AnchoredList, side by side.
    path: doc/prepend.gif
  - description: Scrolling either side of an anchor at row 500,000.
    path: doc/scroll.gif

topics:
  - scroll
  - list
  - sliver
  - scrolling
  - ui

environment:
  sdk: ^3.13.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

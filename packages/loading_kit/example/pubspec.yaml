  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  loading_kit:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

name: loading_kit
description: >-
  A blocking-async overlay that never flickers. Wrap any Future in one call and
  loading_kit handles delayed reveal, minimum display time, reference counting,
  route awareness, cancellation and accessibility — with themed presets.
version: 0.1.0
repository: https://github.com/devshakib/flutter_packages
issue_tracker: https://github.com/devshakib/flutter_packages/issues
documentation: https://github.com/devshakib/flutter_packages/tree/main/packages/loading_kit
resolution: workspace

topics:
  - loading
  - overlay
  - progress
  - async
  - ui

environment:
  sdk: ^3.13.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

name: loading_kit
description: >-
  A blocking-async overlay that never flickers. Wrap any Future in one call:
  delayed reveal, minimum display time, reference counting, cancellation,
  and themed presets.
version: 0.1.0
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/loading_kit
resolution: workspace

topics:
  - loading
  - overlay
  - progress
  - async
  - ui

environment:
  sdk: ^3.13.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

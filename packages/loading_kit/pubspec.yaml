name: loading_kit
description: >-
  A blocking-async overlay that never flickers. Wrap any Future in one call:
  delayed reveal, minimum display time, reference counting, cancellation,
  and themed presets.
version: 0.3.3
repository: https://github.com/devShakib015/flutter_packages
issue_tracker: https://github.com/devShakib015/flutter_packages/issues
documentation: https://github.com/devShakib015/flutter_packages/tree/HEAD/packages/loading_kit
resolution: workspace

screenshots:
  - description: >-
      The same 80ms request, then the same 1.2s request, with and without loading_kit
    path: doc/antiflicker.gif
  - description: >-
      The five presets
    path: doc/presets.gif
  - description: >-
      The six indicator styles
    path: doc/styles.gif
  - description: >-
      The arc closing into a check, then a cross
    path: doc/morph.gif

topics:
  - loading
  - overlay
  - progress
  - async
  - ui

# The two constraints have to agree. Dart ^3.13 means Flutter 3.47, so the
# old pair promised '>=3.32.0' while actually refusing anything below 3.47.
# What this package really needs is Color.withValues(), which arrived in Flutter 3.27.
# Verified by analysing lib/ against a real 3.27.0 SDK.
environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

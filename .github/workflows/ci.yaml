name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Format
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      # Looped rather than listed by name. The listed version silently stopped
      # covering vitals and anchored_list the day they were added.
      - name: Test
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            echo "::group::flutter test — $(basename "$dir")"
            (cd "$dir" && flutter test)
            echo "::endgroup::"
          done
      - name: Publish dry run
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            echo "::group::pub publish --dry-run — $(basename "$dir")"
            (cd "$dir" && flutter pub publish --dry-run)
            echo "::endgroup::"
          done

  # Native code needs a real toolchain. The on-device model itself needs Apple
  # Intelligence hardware that hosted runners do not have, so this compiles the
  # Swift and leaves the model tests as a local step.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      # example/ios and example/macos are generated scaffolding and are
      # gitignored, so a fresh checkout has to recreate them before it can
      # build. Without this the job fails on "No macOS desktop project
      # configured", which it did on every push for two days.
      - name: Scaffold example platforms (apple_foundation_models)
        run: flutter create --platforms=macos,ios .
        working-directory: packages/apple_foundation_models/example
      - name: Build example (macOS)
        run: flutter build macos --debug
        working-directory: packages/apple_foundation_models/example
      - name: Build example (iOS)
        run: flutter build ios --debug --no-codesign
        working-directory: packages/apple_foundation_models/example

      # vitals is HealthKit on Apple, so iOS only.
      - name: Scaffold example platforms (vitals)
        run: flutter create --platforms=ios .
        working-directory: packages/vitals/example
      - name: Build example (iOS)
        run: flutter build ios --debug --no-codesign
        working-directory: packages/vitals/example

  # vitals' Health Connect code. Worth running here because the dev machine
  # cannot hold the Android and Apple toolchains at once.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Scaffold example platforms (vitals)
        run: flutter create --platforms=android .
        working-directory: packages/vitals/example
      - name: Build example (Android)
        run: flutter build apk --debug
        working-directory: packages/vitals/example

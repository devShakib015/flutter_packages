name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Format
        run: dart format --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      # Looped rather than listed by name. The listed version silently stopped
      # covering vitals and anchored_list the day they were added.
      - name: Test
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            echo "::group::flutter test — $(basename "$dir")"
            (cd "$dir" && flutter test)
            echo "::endgroup::"
          done
      # The browser half. `flutter test` never runs an @TestOn('browser') file,
      # so cross_tab, document_pip and file_system_access have been shipping
      # with their web tests unexecuted here — green CI that proved less than
      # it looked like. Detected rather than listed, for the same reason the
      # loop above is a loop.
      - name: Test (Chrome)
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            if grep -rqs "@TestOn('browser')" "$dir/test"; then
              echo "::group::flutter test --platform chrome — $(basename "$dir")"
              (cd "$dir" && flutter test --platform chrome)
              echo "::endgroup::"
            fi
          done

      # document_pip's example/web/ is hand-written, not generated scaffolding,
      # and it shipped missing once. A build is what proves it is still there
      # and still valid.
      - name: Build the web example (document_pip)
        run: flutter build web --release
        working-directory: packages/document_pip/example

      - name: Publish dry run
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            echo "::group::pub publish --dry-run — $(basename "$dir")"
            (cd "$dir" && flutter pub publish --dry-run)
            echo "::endgroup::"
          done

  # `channel: stable` only ever tests the newest Flutter, so a declared floor is
  # never exercised. Each of these claims a different one for a specific reason,
  # and until this job existed every claim rested on one run on one laptop.
  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # requestViewFocusChange existed from 3.24 but was a no-op stub
          # until 3.32, so a lower floor would compile and silently misbehave.
          - package: document_pip
            flutter: '3.32.0'
            tests: 'yes'
          # Only version-sensitive API is TextScaler, in Flutter since 3.12.
          - package: fit_text
            flutter: '3.24.0'
            tests: 'no'
          # Color.withValues() arrived in Flutter 3.27.
          - package: loading_kit
            flutter: '3.27.0'
            tests: 'no'
          # Null-aware collection elements (`?value`) are Dart 3.8, first
          # shipped in Flutter 3.32. Its dev dependencies resolve there too, so
          # the whole suite runs rather than only a compile of lib/.
          - package: woo_client
            flutter: '3.32.0'
            tests: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
      - name: ${{ matrix.package }} on Flutter ${{ matrix.flutter }}, its declared floor
        run: |
          set -euo pipefail
          # Out of the workspace on purpose: sibling packages declare a newer
          # Dart than these SDKs ship, so resolving in place would fail for a
          # reason that has nothing to do with the package under test. The
          # layout is mirrored so the analysis_options include still resolves.
          mkdir -p /tmp/floor/packages
          cp -R "packages/${{ matrix.package }}" /tmp/floor/packages/
          cp analysis_options.yaml /tmp/floor/analysis_options.yaml
          cd "/tmp/floor/packages/${{ matrix.package }}"
          # storefront/ is woo_client's demo app: a Flutter workspace member
          # that cannot resolve on its own, and not part of the package.
          rm -rf example storefront
          sed -i '/^resolution: workspace$/d' pubspec.yaml
          flutter --version
          if [ "${{ matrix.tests }}" = "no" ]; then
            # flutter_lints 6 needs a newer Dart than these floors allow. It is
            # a dev dependency, so it is not in a consumer's solve at all — what
            # the constraint promises is that lib/ COMPILES here, so drop the
            # lint tooling and its config and check exactly that.
            sed -i '/flutter_lints:/d' pubspec.yaml
            : > analysis_options.yaml
            rm -rf test
          fi
          flutter pub get
          flutter analyze --no-pub
          if [ "${{ matrix.tests }}" = "yes" ]; then
            if grep -q 'sdk: flutter' pubspec.yaml; then
              # example/web/ went with the example above, so the one test that
              # asserts those files ship cannot run here. It is about the
              # tarball, not the SDK, and verify already runs it on stable.
              flutter test $(ls test/*.dart | grep -v bootstrap_snippet_test)
            else
              # Pure Dart, so the Dart test runner.
              dart test
            fi
          fi

  # Native code needs a real toolchain. The on-device model itself needs Apple
  # Intelligence hardware that hosted runners do not have, so this compiles the
  # Swift and leaves the model tests as a local step.
  darwin:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      # example/ios and example/macos are generated scaffolding and are
      # gitignored, so a fresh checkout has to recreate them before it can
      # build. Without this the job fails on "No macOS desktop project
      # configured", which it did on every push for two days.
      - name: Scaffold example platforms (apple_foundation_models)
        run: flutter create --platforms=macos,ios .
        working-directory: packages/apple_foundation_models/example
      - name: Build example (macOS)
        run: flutter build macos --debug
        working-directory: packages/apple_foundation_models/example
      - name: Build example (iOS)
        run: flutter build ios --debug --no-codesign
        working-directory: packages/apple_foundation_models/example

      # vitals is HealthKit on Apple, so iOS only.
      - name: Scaffold example platforms (vitals)
        run: flutter create --platforms=ios .
        working-directory: packages/vitals/example
      - name: Build example (iOS)
        run: flutter build ios --debug --no-codesign
        working-directory: packages/vitals/example

  # vitals' Health Connect code. Worth running here because the dev machine
  # cannot hold the Android and Apple toolchains at once.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Scaffold example platforms (vitals)
        run: flutter create --platforms=android .
        working-directory: packages/vitals/example
      # Health Connect needs API 26; a scaffolded example defaults to Flutter's
      # minimum, which is lower, and the manifest merge then refuses.
      - name: Raise the example to minSdk 26
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
        working-directory: packages/vitals/example
      - name: Build example (Android)
        run: flutter build apk --debug
        working-directory: packages/vitals/example
